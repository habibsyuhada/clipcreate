name: Build desktop app & release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: VideoClipper-windows
          - os: macos-latest
            asset_name: VideoClipper-macos
          - os: ubuntu-latest
            asset_name: VideoClipper-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 libwebkit2gtk-4.1-dev

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-desktop.txt

      - name: Build executable
        run: pyinstaller desktop.spec

      - name: Zip artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path dist/VideoClipper/* -DestinationPath ${{ matrix.asset_name }}.zip
        shell: pwsh

      - name: Zip artifact (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: |
          cd dist
          zip -r ../${{ matrix.asset_name }}.zip VideoClipper

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
