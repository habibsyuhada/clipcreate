name: Build desktop app & release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-desktop.txt

      - name: Download static FFmpeg build (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor/ffmpeg | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extract
          $ffmpegExe = Get-ChildItem -Path ffmpeg_extract -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path ffmpeg_extract -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName vendor/ffmpeg/ffmpeg.exe
          Copy-Item $ffprobeExe.FullName vendor/ffmpeg/ffprobe.exe

      - name: Build .exe with PyInstaller (FFmpeg bundled)
        run: pyinstaller build_windows.spec

      - name: Zip artifact
        run: Compress-Archive -Path dist/VideoClipper.exe -DestinationPath VideoClipper-windows.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: VideoClipper-windows
          path: VideoClipper-windows.zip
          if-no-files-found: error

  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_name: VideoClipper-macos
          - os: ubuntu-latest
            asset_name: VideoClipper-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-desktop.txt

      - name: Build executable with PyInstaller
        run: pyinstaller desktop.spec

      - name: Zip artifact
        run: |
          cd dist
          zip -r ../${{ matrix.asset_name }}.zip VideoClipper

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
