name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-desktop.txt

      - name: Download static FFmpeg build (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor/ffmpeg | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extract
          $ffmpegExe = Get-ChildItem -Path ffmpeg_extract -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path ffmpeg_extract -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName vendor/ffmpeg/ffmpeg.exe
          Copy-Item $ffprobeExe.FullName vendor/ffmpeg/ffprobe.exe

      - name: Build .exe with PyInstaller
        run: pyinstaller build_windows.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoClipper-windows
          path: dist/VideoClipper.exe
          if-no-files-found: error
