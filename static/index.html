<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Clipper</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <h1>🎬 Video Clipper</h1>
  <div class="topbar-actions">
    <span id="ffmpegBadge" class="badge badge-muted">memeriksa ffmpeg...</span>
    <button id="openBtn" class="btn">Buka Video</button>
  </div>
</header>

<main id="app" class="app hidden">
  <section class="player-section">
    <div class="video-wrap" id="dropZone">
      <video id="videoEl" controls></video>
    </div>

    <div class="player-controls">
      <button id="playBtn" class="btn small" title="Space">▶ / ⏸</button>
      <span id="timeDisplay" class="mono">00:00.000 / 00:00.000</span>
      <label class="speed-label">Kecepatan
        <select id="speedSelect">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </label>
    </div>

    <div class="timeline-wrap">
      <div id="timeline" class="timeline">
        <img id="timelineThumbs" class="timeline-thumbs hidden" alt="" draggable="false">
        <img id="timelineWaveform" class="timeline-waveform hidden" alt="" draggable="false">
        <div id="timelineSegments" class="timeline-segments"></div>
        <div id="timelinePlayhead" class="timeline-playhead"></div>
        <div id="timelineHoverPreview" class="timeline-hover-preview hidden">
          <div id="hoverThumb" class="hover-thumb"></div>
          <span id="hoverTime" class="mono"></span>
        </div>
      </div>
    </div>

    <div class="mark-controls">
      <button id="setStartBtn" class="btn small" title="I">Set Start (I)</button>
      <input id="startInput" class="time-input" placeholder="mm:ss">
      <button id="setEndBtn" class="btn small" title="O">Set End (O)</button>
      <input id="endInput" class="time-input" placeholder="mm:ss">
      <button id="addClipBtn" class="btn primary small">+ Add Clip</button>
    </div>
    <p class="hint">Shortcut: <kbd>I</kbd> set start · <kbd>O</kbd> set end · <kbd>Space</kbd> play/pause · <kbd>←</kbd>/<kbd>→</kbd> mundur/maju 5 detik</p>
  </section>

  <section class="clips-section">
    <div class="clips-header">
      <h2>Daftar Clip</h2>
      <div class="clips-actions">
        <button id="renderAllBtn" class="btn primary small">Render All</button>
        <button id="mergeModeBtn" class="btn small">Merge Mode</button>
      </div>
    </div>

    <div id="mergeBar" class="merge-bar hidden">
      <input id="mergeName" class="text-input" placeholder="nama file gabungan, mis. final.mp4">
      <label class="merge-transition-label">Transisi
        <select id="mergeTransition">
          <option value="none">Tidak ada (cut)</option>
          <option value="fade">Fade</option>
          <option value="dissolve">Dissolve</option>
        </select>
      </label>
      <input id="mergeTransitionDuration" class="time-input" type="number" min="0.1" max="3" step="0.1" value="0.5" title="Durasi transisi (detik)" disabled>
      <button id="mergeGoBtn" class="btn primary small">Merge & Render</button>
      <span id="mergeStatus" class="mono small-text"></span>
    </div>

    <ul id="clipList" class="clip-list"></ul>
  </section>
</main>

<!-- Modal: file browser -->
<div id="browseModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Pilih Video</h3>
      <button id="browseCloseBtn" class="btn small">✕</button>
    </div>
    <div class="modal-body">
      <div class="browse-path">
        <button id="browseUpBtn" class="btn small">⬆ Naik</button>
        <input id="browsePathInput" class="text-input" placeholder="ketik/paste path lengkap lalu Enter">
      </div>
      <ul id="browseList" class="browse-list"></ul>
    </div>
  </div>
</div>

<!-- Template: item clip -->
<template id="clipItemTemplate">
  <li class="clip-item" data-id="">
    <div class="clip-row">
      <input type="checkbox" class="clip-merge-check hidden">
      <span class="clip-color-dot"></span>
      <input class="clip-name-input text-input" />
      <span class="clip-time mono"></span>
      <span class="clip-badges"></span>
      <span class="clip-status badge badge-muted">idle</span>
      <button class="btn small clip-move-up-btn" title="Naikkan urutan">↑</button>
      <button class="btn small clip-move-down-btn" title="Turunkan urutan">↓</button>
      <button class="btn small clip-preview-btn">Preview</button>
      <button class="btn small clip-edit-btn">Edit</button>
      <button class="btn small clip-render-btn">Render</button>
      <button class="btn small danger clip-delete-btn">Hapus</button>
    </div>
    <div class="clip-error"></div>
    <div class="clip-edit-panel hidden">
      <div class="edit-grid">
        <label>Crop
          <select class="edit-crop">
            <option value="original">Original</option>
            <option value="9:16">9:16 (Shorts)</option>
            <option value="1:1">1:1</option>
            <option value="16:9">16:9</option>
          </select>
        </label>
        <label>Anchor Crop
          <select class="edit-anchor">
            <option value="left">Kiri</option>
            <option value="center" selected>Tengah</option>
            <option value="right">Kanan</option>
          </select>
        </label>
        <label>Kecepatan
          <select class="edit-speed">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
        </label>
        <label>Volume (%)
          <input type="number" class="edit-volume" min="0" max="200" value="100">
        </label>
        <label>Fade In (detik)
          <input type="number" class="edit-fadein" min="0" step="0.1" value="0">
        </label>
        <label>Fade Out (detik)
          <input type="number" class="edit-fadeout" min="0" step="0.1" value="0">
        </label>
        <label class="checkbox-label">
          <input type="checkbox" class="edit-mute"> Mute
        </label>
      </div>
      <div class="edit-section">
        <div class="edit-section-header">
          <span>Teks Overlay</span>
          <button type="button" class="btn small text-layer-add-btn">+ Tambah Teks</button>
        </div>
        <div class="text-layers-list"></div>
      </div>
      <div class="edit-grid">
        <label class="checkbox-label">
          <input type="checkbox" class="edit-watermark-enabled"> Watermark Gambar
        </label>
        <label class="wide">Path Gambar (PNG/JPG)
          <input class="edit-watermark-path text-input" placeholder="path lengkap ke file gambar">
        </label>
        <label>Posisi
          <select class="edit-watermark-position">
            <option value="top-left">Atas Kiri</option>
            <option value="top-center">Atas Tengah</option>
            <option value="top-right" selected>Atas Kanan</option>
            <option value="middle-left">Tengah Kiri</option>
            <option value="middle-center">Tengah</option>
            <option value="middle-right">Tengah Kanan</option>
            <option value="bottom-left">Bawah Kiri</option>
            <option value="bottom-center">Bawah Tengah</option>
            <option value="bottom-right">Bawah Kanan</option>
          </select>
        </label>
        <label>Skala (% lebar video)
          <input type="number" class="edit-watermark-scale" min="5" max="100" value="20">
        </label>
        <label>Opacity (%)
          <input type="number" class="edit-watermark-opacity" min="0" max="100" value="100">
        </label>
      </div>
      <div class="edit-grid">
        <label class="checkbox-label">
          <input type="checkbox" class="edit-subtitle-enabled"> Burn-in Subtitle (.srt)
        </label>
        <label class="wide">Path .srt
          <input class="edit-subtitle-path text-input" placeholder="path lengkap ke file .srt">
        </label>
        <label>Ukuran Font
          <input type="number" class="edit-subtitle-size" min="8" max="80" value="24">
        </label>
      </div>
      <div class="edit-actions">
        <button class="btn small primary edit-save-btn">Simpan Edit</button>
      </div>
    </div>
  </li>
</template>

<!-- Template: satu baris layer teks overlay (dipakai berulang, dinamis) -->
<template id="textLayerTemplate">
  <div class="text-layer-row">
    <input class="text-layer-content text-input" placeholder="isi teks">
    <select class="text-layer-position">
      <option value="top-left">Atas Kiri</option>
      <option value="top-center">Atas Tengah</option>
      <option value="top-right">Atas Kanan</option>
      <option value="middle-left">Tengah Kiri</option>
      <option value="middle-center" selected>Tengah</option>
      <option value="middle-right">Tengah Kanan</option>
      <option value="bottom-left">Bawah Kiri</option>
      <option value="bottom-center">Bawah Tengah</option>
      <option value="bottom-right">Bawah Kanan</option>
    </select>
    <input type="number" class="text-layer-size" min="8" max="200" value="36" title="Ukuran font">
    <input type="color" class="text-layer-color" value="#ffffff" title="Warna teks">
    <input type="color" class="text-layer-outline" value="#000000" title="Warna outline">
    <button type="button" class="btn small danger text-layer-remove-btn">✕</button>
  </div>
</template>

<script src="/static/app.js"></script>
</body>
</html>
